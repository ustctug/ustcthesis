name: Test

on:
  push:
  pull_request:
  schedule:
    # Run every Monday and Friday at 00:42. The time has been chosen at random.
    - cron: '42 0 * * 1,5'
  workflow_dispatch:

jobs:
  test:
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up TeX Live
        uses: zauguin/install-texlive@v4
        with:
          package_file: .github/tl_packages

      - name: Test example
        run: make main

      - name: Test example with LuaTeX
        run: |
          make clean
          latexmk -lualatex main.tex

      - name: Test doc
        run: make doc

      - name: Run regression tests
        run: make test

      - name: Archive failed test output
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: testfiles
          path: build/**/*.diff
          retention-days: 3

  test-historic:
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}
    name: Test TeX Live ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 2026
          - 2025
          - 2024
          - 2023
          - 2022
          - 2021
          - 2020
          - 2019
          - 2018
          - 2017
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up TeX Live ${{ matrix.version }}
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: ${{ matrix.version }}
          package_file: .github/tl_packages

      - name: Test example
        run: make main

      - name: Test example with LuaTeX
        run: |
          make clean
          latexmk -lualatex main.tex

      - name: Test doc
        run: make doc
